<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMS Chat Tester</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Inter, Arial, sans-serif;
        background: #0b1120;
        color: #e5e7eb;
        min-height: 100vh;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
        border: none;
      }

      .app {
        max-width: 1250px;
        margin: auto;
        padding: 25px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        gap: 15px;
      }

      header h1 {
        font-size: 24px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #9ca3af;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ef4444;
      }

      .dot.connected {
        background: #22c55e;
      }

      .panel {
        background: #111827;
        border: 1px solid #253047;
        border-radius: 12px;
        padding: 18px;
      }

      .login {
        margin-bottom: 20px;
      }

      .login h2,
      .sidebar h2 {
        font-size: 16px;
        margin-bottom: 15px;
      }

      .login-grid {
        display: grid;
        grid-template-columns: 1.5fr 1.5fr 1.2fr 1fr auto;
        gap: 10px;
      }

      input,
      select {
        width: 100%;
        padding: 11px 12px;
        border-radius: 7px;
        border: 1px solid #374151;
        background: #0b1120;
        color: white;
        outline: none;
        min-width: 0;
      }

      input:focus,
      select:focus {
        border-color: #6366f1;
      }

      .btn {
        padding: 11px 16px;
        border-radius: 7px;
        font-weight: 600;
        color: white;
        background: #4f46e5;
        white-space: nowrap;
      }

      .btn:hover {
        opacity: 0.85;
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-danger {
        background: #dc2626;
      }

      .btn-gray {
        background: #374151;
      }

      .login-actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      .login-actions select {
        max-width: 180px;
      }

      .main {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 18px;
        height: 650px;
      }

      .sidebar {
        overflow-y: auto;
      }

      .group {
        padding: 14px;
        border: 1px solid #263449;
        border-radius: 8px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #0b1120;
        transition: 0.2s;
      }

      .group:hover,
      .group.active {
        border-color: #6366f1;
        background: #1e1b4b;
      }

      .group strong {
        display: block;
        margin-bottom: 5px;
      }

      .group small {
        color: #9ca3af;
      }

      .chat {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }

      .chat-header {
        padding-bottom: 15px;
        border-bottom: 1px solid #263449;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .chat-header h2 {
        font-size: 17px;
      }

      .chat-header small {
        color: #9ca3af;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 18px 5px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }

      .message {
        max-width: 75%;
        align-self: flex-start;
      }

      .message.mine {
        align-self: flex-end;
      }

      .message-info {
        font-size: 11px;
        color: #9ca3af;
        margin-bottom: 5px;
      }

      .message-content {
        padding: 11px 14px;
        border-radius: 12px;
        background: #263449;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        line-height: 1.5;
      }

      .message.mine .message-content {
        background: #4338ca;
      }

      .message-time {
        font-size: 10px;
        color: #9ca3af;
        margin-top: 5px;
      }

      .typing-indicator {
        min-height: 22px;
        color: #a5b4fc;
        font-size: 12px;
        padding: 3px 5px;
      }

      .composer {
        display: flex;
        gap: 10px;
        padding-top: 12px;
        border-top: 1px solid #263449;
      }

      .composer input {
        flex: 1;
      }

      .empty {
        margin: auto;
        color: #6b7280;
        text-align: center;
      }

      .error {
        color: #f87171;
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .login-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 750px) {
        .app {
          padding: 12px;
        }

        .login-grid {
          grid-template-columns: 1fr;
        }

        .main {
          grid-template-columns: 1fr;
          height: auto;
        }

        .sidebar {
          max-height: 200px;
        }

        .chat {
          height: 550px;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header>
        <h1>💬 LMS Chat Tester</h1>

        <div class="status">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Disconnected</span>
        </div>
      </header>

      <section class="panel login">
        <h2>Authentication & Connection</h2>

        <div class="login-grid">
          <input
            type="text"
            id="serverUrl"
            value="http://127.0.0.1:3000"
            placeholder="Server URL"
          />

          <input type="email" id="email" placeholder="Email" />

          <input type="password" id="password" placeholder="Password" />

          <select id="role">
            <option value="USER">Student</option>
            <option value="ADMIN">Admin</option>
          </select>

          <button class="btn" id="connectBtn" onclick="connectSocket()">
            Login & Connect
          </button>
        </div>

        <div class="login-actions">
          <select id="adminGrade">
            <option value="1">Grade 1</option>
            <option value="2">Grade 2</option>
            <option value="3">Grade 3</option>
            <option value="4">Grade 4</option>
            <option value="5">Grade 5</option>
            <option value="6">Grade 6</option>
            <option value="7">Grade 7</option>
          </select>

          <button class="btn btn-danger" onclick="disconnectSocket()">
            Disconnect
          </button>

          <span id="connectionError" class="error"></span>
        </div>
      </section>

      <div class="main">
        <aside class="panel sidebar">
          <h2>Conversations</h2>

          <button
            class="btn btn-gray"
            style="width: 100%; margin-bottom: 15px"
            onclick="getGroups()"
          >
            ↻ Refresh Groups
          </button>

          <div id="groups">
            <div class="empty">Connect to load groups</div>
          </div>
        </aside>

        <section class="panel chat">
          <div class="chat-header">
            <div>
              <h2 id="chatTitle">Select a conversation</h2>
              <small id="chatSubtitle">No conversation selected</small>
            </div>

            <button
              class="btn btn-gray"
              id="historyBtn"
              onclick="getMessages()"
              disabled
            >
              Refresh History
            </button>
          </div>

          <div class="messages" id="messages">
            <div class="empty">Open a conversation to start chatting</div>
          </div>

          <div class="typing-indicator" id="typingIndicator"></div>

          <div class="composer">
            <input
              type="text"
              id="messageInput"
              placeholder="Write a message..."
              disabled
              oninput="handleTyping()"
              onkeydown="handleEnter(event)"
            />

            <button class="btn" id="sendBtn" onclick="sendMessage()" disabled>
              Send
            </button>
          </div>
        </section>
      </div>
    </div>

    <script>
      // ==========================================
      // CONFIGURATION
      // ==========================================

      const LOGIN_ENDPOINT = "/api/v1/auth/login";

      // ==========================================
      // STATE
      // ==========================================

      let socket = null;

      let accessToken = null;
      let currentRole = null;

      let currentGrade = null;
      let currentConversation = null;

      let currentUserId = null;

      let typingTimeout = null;
      let isTyping = false;

      let hasMoreMessages = false;
      let oldestMessageDate = null;

      let groupsData = [];

      const $ = (id) => document.getElementById(id);

      // ==========================================
      // AUTHENTICATION & CONNECTION
      // ==========================================

      async function connectSocket() {
        const serverUrl = $("serverUrl").value.trim().replace(/\/$/, "");
        const email = $("email").value.trim();
        const password = $("password").value;
        const role = $("role").value;

        if (!serverUrl || !email || !password) {
          showError("Server URL, Email and Password are required");
          return;
        }

        if (socket) {
          socket.disconnect();
          socket = null;
        }

        clearError();

        $("connectBtn").disabled = true;
        $("connectBtn").textContent = "Logging in...";

        try {
          const response = await fetch(`${serverUrl}${LOGIN_ENDPOINT}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email,
              password,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Login failed");
          }

          accessToken = data.tokens?.accessToken;

          if (!accessToken) {
            console.error("Login response:", data);
            throw new Error("Access token not found in response");
          }

          currentRole = role;

          const decodedToken = decodeJwt(accessToken);

          currentUserId =
            decodedToken?.id || decodedToken?._id || decodedToken?.sub || null;

          const authorization = `${role} ${accessToken}`;

          console.log("Login successful");
          console.log("Selected role:", role);
          console.log("Authorization header:", `${role} [TOKEN]`);

          socket = io(serverUrl, {
            transports: ["polling"],
            extraHeaders: {
              Authorization: authorization,
            },
          });

          registerSocketEvents();

          $("connectBtn").textContent = "Connecting...";
        } catch (error) {
          console.error("Authentication error:", error);

          showError(error.message);

          $("connectBtn").disabled = false;
          $("connectBtn").textContent = "Login & Connect";
        }
      }

      // ==========================================
      // JWT DECODER
      // ==========================================

      function decodeJwt(token) {
        try {
          const payload = token.split(".")[1];
          const base64 = payload.replace(/-/g, "+").replace(/_/g, "/");

          return JSON.parse(
            decodeURIComponent(
              atob(base64)
                .split("")
                .map(
                  (char) =>
                    "%" + char.charCodeAt(0).toString(16).padStart(2, "0"),
                )
                .join(""),
            ),
          );
        } catch (error) {
          console.warn("Could not decode JWT:", error);
          return null;
        }
      }

      // ==========================================
      // DISCONNECT
      // ==========================================

      function disconnectSocket() {
        if (socket) {
          socket.disconnect();
          socket = null;
        }

        accessToken = null;
        currentRole = null;
        currentUserId = null;

        currentGrade = null;
        currentConversation = null;

        groupsData = [];

        isTyping = false;
        hasMoreMessages = false;
        oldestMessageDate = null;

        clearTimeout(typingTimeout);

        setConnectionStatus(false);

        $("groups").innerHTML = '<div class="empty">Disconnected</div>';

        $("messages").innerHTML = '<div class="empty">Disconnected</div>';

        $("messageInput").disabled = true;
        $("sendBtn").disabled = true;
        $("historyBtn").disabled = true;

        $("chatTitle").textContent = "Select a conversation";
        $("chatSubtitle").textContent = "No conversation selected";
        $("typingIndicator").textContent = "";

        $("connectBtn").disabled = false;
        $("connectBtn").textContent = "Login & Connect";

        clearError();
      }

      // ==========================================
      // CONNECTION STATUS
      // ==========================================

      function setConnectionStatus(connected) {
        $("statusDot").classList.toggle("connected", connected);

        $("statusText").textContent = connected ? "Connected" : "Disconnected";

        if (connected) {
          $("connectBtn").disabled = true;
        } else {
          $("connectBtn").disabled = false;
        }
      }

      // ==========================================
      // SOCKET EVENTS
      // ==========================================

      function registerSocketEvents() {
        socket.on("connect", () => {
          console.log("Connected:", socket.id);

          setConnectionStatus(true);
          $("connectBtn").textContent = "Connected";

          getGroups();
        });

        socket.on("connect_error", (error) => {
          console.error("Connection error:", error.message);

          showError(error.message);
          setConnectionStatus(false);

          $("connectBtn").textContent = "Login & Connect";
        });

        socket.on("disconnect", (reason) => {
          console.log("Disconnected:", reason);

          setConnectionStatus(false);
          $("connectBtn").textContent = "Login & Connect";
        });

        // GROUPS

        socket.on("groups", (groups) => {
          console.log("Groups:", groups);
          renderGroups(groups);
        });

        // MESSAGE HISTORY

        socket.on("messages", (data) => {
          console.log("Messages:", data);

          if (Number(data.grade) !== Number(currentGrade)) {
            console.log("Ignoring messages for another grade");
            return;
          }

          hasMoreMessages = Boolean(data.hasMore);

          const messages = data.messages || [];

          oldestMessageDate =
            messages.length > 0
              ? messages[messages.length - 1].createdAt
              : null;

          renderMessages(messages);
        });

        // NEW MESSAGE

        socket.on("newMessage", (message) => {
          console.log("New message:", message);

          if (Number(message.grade) !== Number(currentGrade)) {
            getGroups();
            return;
          }

          appendMessage(message);
          getGroups();
        });

        // ==========================================
        // TYPING
        // ==========================================

        socket.on("typing", (data) => {
          console.log("Typing event received:", data);

          if (Number(data.grade) !== Number(currentGrade)) {
            return;
          }

          if (String(data.userId) === String(currentUserId)) {
            return;
          }

          $("typingIndicator").textContent =
            `${data.name || "Someone"} is typing...`;
        });

        // ==========================================
        // STOP TYPING
        // ==========================================

        socket.on("stopTyping", (data) => {
          console.log("Stop typing event received:", data);

          if (Number(data.grade) !== Number(currentGrade)) {
            return;
          }

          if (String(data.userId) === String(currentUserId)) {
            return;
          }

          $("typingIndicator").textContent = "";
        });

        // SOCKET ERRORS

        socket.on("socketError", (data) => {
          console.error("Socket error:", data);

          showError(`${data.event}: ${data.error}`);
        });
      }

      // ==========================================
      // PAYLOAD HELPERS
      // ==========================================

      function isAdmin() {
        return currentRole === "ADMIN";
      }

      // IMPORTANT:
      // Admin uses the currently opened conversation grade.
      // Student grade is resolved from authenticated socket user.

      function gradePayload(grade = currentGrade) {
        if (isAdmin()) {
          if (grade === null || grade === undefined) {
            throw new Error("Please select a conversation first");
          }

          return {
            grade: Number(grade),
          };
        }

        return {};
      }

      // ==========================================
      // GET GROUPS
      // ==========================================

      function getGroups() {
        if (!socket || !socket.connected) return;

        socket.emit("getGroups", {});
      }

      function renderGroups(groups) {
        const container = $("groups");

        groupsData = groups || [];

        container.innerHTML = "";

        if (groupsData.length === 0) {
          container.innerHTML =
            '<div class="empty">No conversations found</div>';
          return;
        }

        groupsData.forEach((group) => {
          const element = document.createElement("div");

          element.className = "group";

          if (Number(group.grade) === Number(currentGrade)) {
            element.classList.add("active");
          }

          const title = document.createElement("strong");
          title.textContent = `Grade ${group.grade}`;

          const lastMessage = document.createElement("small");
          lastMessage.textContent = group.lastMessage || "No messages yet";

          const date = document.createElement("small");
          date.style.display = "block";
          date.style.marginTop = "5px";

          date.textContent = group.lastMessageAt
            ? formatDate(group.lastMessageAt)
            : "";

          element.append(title, lastMessage, date);

          element.onclick = () => openChat(group);

          container.appendChild(element);
        });
      }

      // ==========================================
      // OPEN CHAT
      // ==========================================

      function openChat(group) {
        if (!socket || !socket.connected) return;

        currentGrade = Number(group.grade);
        currentConversation = group._id;

        // Keep admin select synchronized with opened conversation.
        if (isAdmin()) {
          $("adminGrade").value = String(currentGrade);
        }

        // Reset pagination and typing state.
        hasMoreMessages = false;
        oldestMessageDate = null;

        isTyping = false;
        clearTimeout(typingTimeout);

        $("chatTitle").textContent = `Grade ${currentGrade}`;
        $("chatSubtitle").textContent = "Group conversation";

        $("messageInput").disabled = false;
        $("sendBtn").disabled = false;
        $("historyBtn").disabled = false;

        $("typingIndicator").textContent = "";

        $("messages").innerHTML =
          '<div class="empty">Loading messages...</div>';

        renderGroups(groupsData);

        console.log("Opened conversation:", currentGrade);

        getMessages();
      }

      // ==========================================
      // GET MESSAGE HISTORY
      // ==========================================

      function getMessages(before = null) {
        if (!socket || !socket.connected || currentGrade === null) {
          return;
        }

        const payload = {
          ...gradePayload(currentGrade),
          limit: 30,
        };

        if (before) {
          payload.before = before;
        }

        console.log("Getting messages:", payload);

        socket.emit("getMessages", payload);
      }

      // ==========================================
      // LOAD OLDER MESSAGES
      // ==========================================

      function loadOlderMessages() {
        if (!hasMoreMessages || !oldestMessageDate) return;

        getMessages(oldestMessageDate);
      }

      // ==========================================
      // RENDER MESSAGES
      // ==========================================

      function renderMessages(messages) {
        const container = $("messages");

        container.innerHTML = "";

        if (messages.length === 0) {
          container.innerHTML =
            '<div class="empty">No messages yet. Start the conversation!</div>';
          return;
        }

        // Backend returns newest first.
        // Reverse to display oldest first.

        [...messages].reverse().forEach((message) => {
          appendMessage(message, false);
        });

        container.scrollTop = container.scrollHeight;
      }

      // ==========================================
      // APPEND MESSAGE
      // ==========================================

      function appendMessage(message, scroll = true) {
        const container = $("messages");

        const messageId = String(message._id);

        if (
          Array.from(container.querySelectorAll(".message")).some(
            (element) => element.dataset.id === messageId,
          )
        ) {
          return;
        }

        const sender = message.sender || message.senderId || {};

        const senderId = sender._id || sender.id || message.senderId;

        const mine =
          currentUserId !== null && String(senderId) === String(currentUserId);

        const name =
          sender.username ||
          [sender.firstName, sender.lastName].filter(Boolean).join(" ") ||
          sender.name ||
          "Unknown";

        const wrapper = document.createElement("div");

        wrapper.className = `message ${mine ? "mine" : ""}`;
        wrapper.dataset.id = messageId;

        const info = document.createElement("div");
        info.className = "message-info";
        info.textContent = mine ? "You" : name;

        const content = document.createElement("div");
        content.className = "message-content";
        content.textContent = message.content || "";

        const time = document.createElement("div");
        time.className = "message-time";
        time.textContent = formatDate(message.createdAt);

        wrapper.append(info, content, time);

        container.appendChild(wrapper);

        if (scroll) {
          container.scrollTop = container.scrollHeight;
        }
      }

      // ==========================================
      // SEND MESSAGE
      // ==========================================

      function sendMessage() {
        if (!socket || !socket.connected || currentGrade === null) {
          return;
        }

        const input = $("messageInput");
        const content = input.value.trim();

        if (!content) return;

        const payload = {
          ...gradePayload(currentGrade),
          content,
        };

        console.log("Sending message:", payload);

        socket.emit("sendMessage", payload);

        input.value = "";

        stopTyping();
        input.focus();
      }

      // ==========================================
      // ENTER TO SEND
      // ==========================================

      function handleEnter(event) {
        if (event.key === "Enter") {
          event.preventDefault();
          sendMessage();
        }
      }

      // ==========================================
      // TYPING
      // ==========================================

      function handleTyping() {
        if (!socket || !socket.connected || currentGrade === null) {
          return;
        }

        if (!isTyping) {
          isTyping = true;

          const payload = gradePayload(currentGrade);

          console.log("Typing:", payload);

          socket.emit("typing", payload);
        }

        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(() => {
          stopTyping();
        }, 1200);
      }

      // ==========================================
      // STOP TYPING
      // ==========================================

      function stopTyping() {
        if (!socket || !socket.connected || currentGrade === null) {
          return;
        }

        if (!isTyping) return;

        isTyping = false;

        clearTimeout(typingTimeout);

        const payload = gradePayload(currentGrade);

        console.log("Stop typing:", payload);

        socket.emit("stopTyping", payload);
      }

      // ==========================================
      // UTILITIES
      // ==========================================

      function formatDate(date) {
        if (!date) return "";

        return new Date(date).toLocaleString();
      }

      function showError(message) {
        $("connectionError").textContent = message;
      }

      function clearError() {
        $("connectionError").textContent = "";
      }
    </script>
  </body>
</html>
